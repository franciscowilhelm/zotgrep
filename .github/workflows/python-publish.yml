# Publishes zotgrep to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored in the repository.
# See PUBLISHING.md for the release procedure.

name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/test.yml

  release-build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${RELEASE_TAG#v}" != "$package_version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match pyproject.toml version '$package_version'. Bump the version or fix the tag."
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches package version $package_version"

      - name: Build release distributions
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/zotgrep/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
