name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets the publish workflow run the same test suite before building a release.
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes immutable full-version tags only, so pin the commit.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests against the lockfile
        run: uv run --locked --group test pytest -q
